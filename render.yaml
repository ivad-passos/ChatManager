# Infraestrutura como Código — Render (Blueprint)
# Monorepo: o backend vive na pasta /backend (rootDir).
# Para usar: conecte este repositório no Render via "New + > Blueprint".
services:
  - type: web
    name: physiovilas-chatmanager-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Valores secretos são preenchidos no dashboard do Render (sync: false)
      - key: META_VERIFY_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_PHONE_NUMBER_ID
        sync: false
